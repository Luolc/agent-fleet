[title]
en = "Pin each Go tool in a module file of its own under tools/"

[text.statement]
en = "Pin each Go tool the checks use in a module file of its own, `tools/<tool>.mod`, and run it with `go tool -modfile=tools/<tool>.mod <tool>`."

[text.reason]
en = '''
A tool pinned this way runs at the same version on every machine and in CI, and needs nothing installed beyond Go.
'''

[text.verification]
en = '''
The tools pinned so far are `golangci-lint` and `govulncheck`.

Violated when a check runs a Go tool that is not pinned this way.
'''
