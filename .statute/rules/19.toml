uses = ["instructions"]

[title]
en = "Look for work already under way before starting a job"

[text.statement]
en = "Before starting a job in this repository, look at `fleet job list` and the open issues for work already under way, and when unsure whether it is, ask through the route your role gives."

[text.reason]
en = '''
This repository has no natural key that tells two jobs on the same work apart.
'''

[text.verification]
en = '''
Violated when a job is started on work that `fleet job list` or an open issue shows already under way.
'''
