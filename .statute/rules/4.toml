[title]
en = "Put every package other than the binary under internal/"

[text.statement]
en = "Put every Go package other than the `fleet` binary in `cmd/fleet/` under `internal/`."

[text.reason]
en = '''
This repository offers no Go API; packages under `internal/` cannot be imported from outside it, so nothing outside depends on their shape.
'''

[text.verification]
en = '''
Violated when a change adds a Go package outside `cmd/fleet/` and `internal/`.
'''
