[title]
en = "Pin the Go version in go.mod with a single go line"

[text.statement]
en = "Pin the Go version in `go.mod` with a single `go` line and no `toolchain` line."

[text.reason]
en = '''
The checks run with `GOTOOLCHAIN=local`, so a Go that does not match fails instead of downloading another one; a `toolchain` line would name a second version.
'''

[text.verification]
en = '''
Violated when `go.mod` has a `toolchain` line or more than one `go` line.
'''
