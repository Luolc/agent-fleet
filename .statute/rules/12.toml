[title]
en = "A merge into main does not wait for CI"

[text.statement]
en = "A merge into `main` here does not wait for CI: `check` is not a required status check, and an approved pull request may be merged before it finishes."

[text.reason]
en = '''
{@rule:R211} asks a repository's instructions to say whether a merge waits for CI; this says it does not.
'''

[text.verification]
en = '''
A pull request whose `check` has already failed at the approved head is still not merged.

Violated when the instructions here are read as making a merge wait for `check` to finish.
'''
