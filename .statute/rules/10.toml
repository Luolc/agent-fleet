[title]
en = "The checks a change touches, by what it changes"

[text.statement]
en = '''
The checks a change here touches, besides the commit hooks (`pre-commit run --all-files`), are:

- for any file outside `docs/` and the Markdown files: `scripts/check.sh` (gofmt, `go vet`, golangci-lint, `go test`, govulncheck, a static build, the design's line cap and the judge's shards), with `FLEET_CHECK_CORES=N` on a machine shared with others to limit it to N cores;
- for `docs/design.md` alone: `scripts/check-design-cap.sh`;
- for `cmd/`, `internal/`, `go.mod`, `go.sum` or `judge/`: `judge/run.sh <binary>` against a binary built from the change (`go build -o <binary> ./cmd/fleet`); it needs docker, and `JUDGE_SUITES="<suite> ..."` runs only those suites.
'''

[text.reason]
en = '''
{@rule:R53} asks for the checks a change touches, as the project's instructions list them; this is that list.
'''

[text.verification]
en = '''
The commit hooks run gitleaks on the staged changes, then gofmt, then `statute compile --check` when a statute input or output changes. `scripts/check.sh` runs with `GOTOOLCHAIN=local`. CI also runs `go test -race ./...` at default parallelism; a local run limited in cores does not stand in for it. When unsure whether a check is touched, it runs.

Violated when a change is pushed without a check this list gives for the paths it changes having passed on the pushed version.
'''
