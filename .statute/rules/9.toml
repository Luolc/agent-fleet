[title]
en = "Raise the installed Go before raising go.mod"

[text.statement]
en = "Raise the `go` line of `go.mod` only to a Go version already installed where the checks run, so the installed Go is raised first."

[text.reason]
en = '''
The checks run with `GOTOOLCHAIN=local` and fail when the installed Go is older than `go.mod` asks.
'''

[text.verification]
en = '''
Violated when a change raises the `go` line above the Go installed on the machines that run the checks.
'''
