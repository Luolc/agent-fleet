default = "on"
authority = ["simplicity"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Parse each subcommand's flags with a flag.FlagSet of its own"

[text.statement]
en = "In `cmd/fleet/`, let `main` dispatch on the first argument and give each subcommand its own `flag.FlagSet` from Go's standard library, with no third-party command-line package."

[text.reason]
en = '''
The standard library covers what the command line needs, and a dependency it would replace is not indispensable.
'''

[text.verification]
en = '''
Violated when a change parses a subcommand's flags with another package, or shares one flag set between subcommands.
'''
