default = "on"
authority = ["discriminating-checks"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Let each judge suite run alone, in one CI shard"

[text.statement]
en = "Write each suite of `judge/` so that it sets up everything it needs and runs alone, and give each suite a place in exactly one of the judge's CI shards."

[text.reason]
en = '''
CI runs the suites in shards set by `JUDGE_SUITES`, and an agent runs only the suites it needs; a suite that relies on another, or on no shard, goes unchecked.
'''

[text.verification]
en = '''
`scripts/check-judge-shards.sh`, run by `scripts/check.sh`, fails until every suite is in a shard once.

Violated when a suite fails run alone with `JUDGE_SUITES` naming only it, or is in no shard or in more than one.
'''
