[title]
en = "Let tests use t.TempDir and never the real home directory or the network"

[text.statement]
en = "In Go tests, put files under `t.TempDir()`, and never read the real home directory or use the network."

[text.reason]
en = '''
A test that reads the machine it runs on passes or fails with that machine instead of with the code.
'''

[text.verification]
en = '''
Violated when a test reads `$HOME` or a path under it without pointing it at a temporary directory first, or opens a network connection.
'''
