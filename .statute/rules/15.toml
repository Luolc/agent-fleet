[title]
en = "Use only reserved domains and documentation addresses in test data"

[text.statement]
en = "In test data, use as domains only ones under `example.test`, and as IP addresses only ones from 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24 and 2001:db8::/32."

[text.reason]
en = '''
This repository is public; these domains and ranges are reserved for examples and can never be real.
'''

[text.verification]
en = '''
Violated when test data holds another domain or IP address.
'''
