# Written by `statute init`; `statute add` and `statute remove` change the rules.
constitution = { source = "R", edition = "2026-10" }
public = true

domains = [
  # Agents write and change this repository's own rules in .statute/rules/.
  "R96",
  # The repository keeps a design, docs/design.md.
  "R232",
  # Work here is divided among agents the way fleet does.
  "R78",
  # fleet itself starts the agents that work here.
  "R161",
  # The agents here take their work from tickets, one child ticket per attempt
  # (.fleet/config.json names the project).
  "R175",
]

rules = [
  # A pull request that changes how fleet works updates the design in the same change.
  "R80",
  # main is protected and takes changes only through reviewed pull requests.
  "R57",
  # The repository is public: a reviewer reads what is pushed before the push.
  "R52",
  # On a pull request, the run of check is what counts, not a full local run.
  "R72",
  # check is not a required status check: a merge does not wait for it (L12), but a
  # pull request whose check already failed at the approved head is not merged.
  "R211",
  # CI runners are pinned to a fixed Ubuntu release.
  "R212",
  # Tests use only made-up data (L15 sets the values) and reach nothing outside the test.
  "R27",
]

exclude = [
  # The design is one file, docs/design.md, under a line cap (L7): not split by topic,
  "R113",
  # and so with no index.
  "R114",
]

[language]
code-comments = "en"
docs = "en"
commits = "en"
pull-requests = "en"
# What agents write to a person here is in English, as the repository is; a person who
# reads another language sets it in their own configuration.
communication = "en"
# The tickets of this repository's work are written in Chinese.
work-items = "zh"
