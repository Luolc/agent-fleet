name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PRE_COMMIT_VERSION: 4.6.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --verbose .

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      - name: pre-commit
        env:
          SKIP: gitleaks
        run: pipx run "pre-commit==${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure

      - name: check script
        run: scripts/check.sh

      - name: race tests
        run: go test -race ./...

      # The judge is red until the port lands: `continue-on-error` keeps it
      # from blocking merges meanwhile. Delete that one line once it is green.
      - name: judge (black-box e2e against the Go binary)
        continue-on-error: true
        run: |
          go build -o "$RUNNER_TEMP/fleet" ./cmd/fleet
          judge/run.sh "$RUNNER_TEMP/fleet"
