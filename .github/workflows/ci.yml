name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PRE_COMMIT_VERSION: 4.6.2

# lint, race and the judge's shards run in parallel; check is the required
# status check and passes only when all of them succeeded.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --verbose .

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      - name: pre-commit
        env:
          SKIP: gitleaks
        run: pipx run "pre-commit==${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure

      - name: check script
        run: scripts/check.sh

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      - name: race tests
        run: go test -race ./...

  # The judge's suites in three shards, so the longest suite (lifecycle)
  # sets the judge's time; together the shards run every suite once.
  judge:
    name: judge (${{ matrix.suites }})
    strategy:
      fail-fast: false
      matrix:
        suites: [lifecycle, thread, usage send watch worktree unblock]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      # The image depends only on the Dockerfile and the fake claude it copies.
      - name: judge image cache
        id: judge-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/judge-image.tar
          key: judge-image-${{ hashFiles('judge/Dockerfile', 'judge/bin/**') }}

      - name: judge image
        env:
          HIT: ${{ steps.judge-image.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            docker load -i "$RUNNER_TEMP/judge-image.tar"
          else
            docker build -t fleet-judge judge
            docker save -o "$RUNNER_TEMP/judge-image.tar" fleet-judge
          fi

      - name: judge (black-box e2e against the Go binary)
        env:
          JUDGE_IMAGE: fleet-judge
          JUDGE_SUITES: ${{ matrix.suites }}
        run: |
          go build -o "$RUNNER_TEMP/fleet" ./cmd/fleet
          judge/run.sh "$RUNNER_TEMP/fleet"

  check:
    needs: [lint, race, judge]
    # Without always(), check is skipped when a job it needs fails, and
    # GitHub counts a skipped required check as passed. needs.judge.result
    # is success only when every shard succeeded.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: require every job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          RACE: ${{ needs.race.result }}
          JUDGE: ${{ needs.judge.result }}
        run: |
          echo "lint: $LINT, race: $RACE, judge: $JUDGE"
          [ "$LINT" = success ] && [ "$RACE" = success ] && [ "$JUDGE" = success ]
