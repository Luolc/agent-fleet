name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Every main commit needs a result of its own, so each one gets its own
  # group: a shared group would cancel a pending run when a newer one
  # arrives. On a PR branch, a newer push cancels the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  PRE_COMMIT_VERSION: 4.6.2

# changes decides which of race and the judge a change needs; lint always
# runs. check sums up the run: all-green passes it only when every job
# succeeded or was skipped because changes said it need not run.
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # find the last green run of this workflow on main
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Each group is named after the job it gates; docs has no job, so a
      # docs-only change runs only lint. A path in no group runs everything.
      - id: changes
        uses: Luolc/ci-actions/changes@ad865a7a9c01b617b1becb685995ea590252d698 # main, 2026-10-10
        with:
          groups: |
            race: cmd/** internal/** go.mod go.sum
            judge: cmd/** internal/** go.mod go.sum judge/**
            docs: docs/** *.md LICENSE
          run-all-on: .github/** scripts/** tools/** .golangci.yml .pre-commit-config.yaml .fleet/**

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scans the commits of this PR or push; gitleaks.yml scans the whole
      # history weekly.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1 # the rev of the hook in .pre-commit-config.yaml
          # Commenting on the PR would need pull-requests: write; the job
          # log and summary show the finding.
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      # The statute-compile hook runs the statute that statute.lock names, the
      # version that compiled the files it compares.
      - name: statute version
        id: statute
        run: |
          version=$(sed -n 's/^statute = "\(.*\)"$/\1/p' statute.lock)
          [ -n "$version" ] || { echo "no statute version in statute.lock" >&2; exit 1; }
          echo "statute version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install statute
        env:
          VERSION: ${{ steps.statute.outputs.version }}
          TARGET: statute-x86_64-unknown-linux-musl
        run: |
          dir=$(mktemp -d)
          base="https://github.com/Luolc/agent-constitution/releases/download/statute-v${VERSION}"
          curl --fail --silent --show-error --location --output "$dir/$TARGET.tar.gz" "$base/$TARGET.tar.gz"
          curl --fail --silent --show-error --location --output "$dir/$TARGET.sha256" "$base/$TARGET.sha256"
          (cd "$dir" && sha256sum --check --strict "$TARGET.sha256")
          mkdir "$dir/unpacked"
          tar -xzf "$dir/$TARGET.tar.gz" -C "$dir/unpacked" statute
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$dir/unpacked/statute" "$HOME/.local/bin/statute"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/statute" --version

      - name: pre-commit
        env:
          SKIP: gitleaks
        run: pipx run "pre-commit==${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure

      - name: check script
        run: scripts/check.sh

  race:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      - name: race tests
        run: go test -race ./...

  # The judge's suites in three shards, so the longest suite (lifecycle)
  # sets the judge's time; together the shards run every suite once. The
  # shards share the job id judge, which is what check and the group see.
  judge:
    needs: changes
    if: fromJSON(needs.changes.outputs.groups).judge
    name: judge (${{ matrix.suites }})
    strategy:
      fail-fast: false
      matrix:
        suites: [lifecycle, thread, usage send watch worktree watchthread watches unblock]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/*.sum

      # The image depends only on the Dockerfile and the fake claude it copies.
      - name: judge image cache
        id: judge-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/judge-image.tar
          key: judge-image-${{ hashFiles('judge/Dockerfile', 'judge/bin/**') }}

      - name: judge image
        env:
          HIT: ${{ steps.judge-image.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            docker load -i "$RUNNER_TEMP/judge-image.tar"
          else
            docker build -t fleet-judge judge
            docker save -o "$RUNNER_TEMP/judge-image.tar" fleet-judge
          fi

      - name: judge (black-box e2e against the Go binary)
        env:
          JUDGE_IMAGE: fleet-judge
          JUDGE_SUITES: ${{ matrix.suites }}
        run: |
          go build -o "$RUNNER_TEMP/fleet" ./cmd/fleet
          judge/run.sh "$RUNNER_TEMP/fleet"

  check:
    needs: [changes, lint, race, judge]
    # Without always(), check is skipped when a job it needs fails, and
    # GitHub counts a skipped required check as passed. needs.judge.result
    # is success only when every shard succeeded.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: Luolc/ci-actions/all-green@ad865a7a9c01b617b1becb685995ea590252d698 # main, 2026-10-10
        with:
          needs: ${{ toJSON(needs) }}
