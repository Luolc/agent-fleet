repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # AGENTS.md and the skills statute copies and links must match a fresh
  # compile of statute.toml and statute.lock; the private output, which git
  # ignores, is not compared. rev must name the statute version in
  # statute.lock: statute refuses a lock another version wrote, so the hook
  # fails until the two agree.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.29
    hooks:
      - id: statute-compile
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: bash -c 'out=$(gofmt -l "$@") && [ -z "$out" ] || { echo "$out"; exit 1; }' --
        types: [go]
